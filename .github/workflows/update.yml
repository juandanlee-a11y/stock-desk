name: 대시보드 갱신

# 시간은 UTC 기준입니다. 한국시간(KST) = UTC + 9시간
on:
  schedule:
    - cron: "30 23 * * 0-4"   # 한국시간 평일 오전 08:30 (장 시작 전)
    - cron: "0 7 * * 1-5"     # 한국시간 평일 오후 16:00 (한국장 마감 후)
    - cron: "30 14 * * 1-5"   # 한국시간 평일 밤 23:30 (미국장 개장 후)
  workflow_dispatch:          # Actions 탭에서 손으로 돌릴 수 있는 버튼

permissions:
  contents: write             # 수집한 데이터를 저장소에 다시 저장하기 위해 필요

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install --quiet yfinance pandas requests

      - name: 데이터 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python fetch.py

      - name: 결과 저장
        run: |
          git config user.name "stock-desk"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data.js data.prev.json
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없어 커밋을 건너뜁니다"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi
